name: Deploy Flutter Web to GitHub Pages

on:
  # જ્યારે તમે કોડ પુશ કરો ત્યારે રન થશે
  push:
    branches:
      - rich-text-implementation
  
  # આ લાઈન ઉમેરવાથી "Run workflow" બટન આવી જશે
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.19.0'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Web App
        # તમારા રીપોઝીટરીનું નામ editor_app છે
        run: flutter build web --release --base-href "/editor_app/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
